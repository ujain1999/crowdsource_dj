[project]
name = "crowdsource-dj-backend"
version = "0.1.0"
description = "Crowdsource DJ realtime backend"
authors = [
    { name = "ujain1999", email = "43496188+ujain1999@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.142.0",
    "uvicorn[standard]>=0.54.0",
    "yt-dlp>=2026.8.19",
    "ytmusicapi>=1.12.3",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "playwright>=1.63.0",
    "pytest>=9.1.1",
    "pytest-timeout>=2.4.0",
    "websockets>=17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
