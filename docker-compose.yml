services:
  app:
    build: .
    image: crowdsource-dj
    ports:
      # Local only: cloudflared on this host is the way in. Publishing on all interfaces
      # would let anyone skip Cloudflare and forge the client address header below.
      - "127.0.0.1:8000:8000"
    environment:
      CDJ_CLIENT_IP_HEADER: "CF-Connecting-IP"
      CDJ_DJ_GRACE_SECONDS: "15"
      CDJ_POLL_SECONDS: "60"
    volumes:
      - cdj-data:/data
    restart: unless-stopped

volumes:
  cdj-data:
